[package]
name = "kith"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-core = "0.3.33"
image = "0.25.10"
jiff = "0.2.35"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "1.1.4"
ulid = "3.0.0"
